name: Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public

      - name: Publish to MCP Registry
        if: vars.MCP_REGISTRY_PUBLISH == 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar -xz -C /tmp mcp-publisher
          /tmp/mcp-publisher login dns --domain flowrelay.it --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          /tmp/mcp-publisher publish server.json
